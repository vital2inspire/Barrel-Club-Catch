<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrel Club Catch</title>
<style>
  body { margin:0; background:#1b120c; overflow:hidden; }
  canvas { display:block; margin:auto; background:#1b120c; }

  #playAgain {
    position:absolute; left:50%; top:65%; transform:translateX(-50%);
    background:#d4af37; border:2px solid #3a2a1d; color:#1b120c;
    font-family:Georgia,serif; font-size:20px; border-radius:12px;
    padding:10px 25px; cursor:pointer;
    opacity:0; transition:opacity 1s ease; pointer-events:none;
  }
  #playAgain.show {
    opacity:1; pointer-events:auto;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="720"></canvas>
<button id="playAgain">Play Again</button>

<script>
/*
============================================================
Barrel Club Catch – Transparent Crate Edition
Version 1.4 — November 2025
============================================================
*/

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("playAgain");

let state = "start";
let barrels = [], score = 0, misses = 0, caught = 0;
const totalBarrels = 99;
let spawnTimer = 0, spawnDelay = 1200, last = 0;
const player = { x:200, y:630, w:100, h:80 };

// Load images
const bg = new Image(); bg.src = "rickhouse-bg.png";
const barrelImg = new Image(); barrelImg.src = "barrel.png";
const crateImg = new Image(); crateImg.src = "crate.png";
let crateTex = null;

// helper: removes near-white/checker pixels (in case PNG isn't truly transparent)
function makeWhiteTransparent(image) {
  const w = image.naturalWidth, h = image.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(image, 0, 0);
  const img = x.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const neutral = (max - min) < 20; 
    const light = max > 170;
    if (neutral && light) d[i+3] = 0;
  }
  x.putImageData(img, 0, 0);
  return c;
}
crateImg.onload = () => { crateTex = makeWhiteTransparent(crateImg); };

function drawStart(){
  ctx.drawImage(bg,0,0,480,720);
  ctx.fillStyle="rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,480,720);
  ctx.fillStyle="#d4af37";
  ctx.font="48px Georgia";
  ctx.textAlign="center";
  ctx.fillText("Barrel Club Catch",240,360);
  ctx.font="22px Georgia";
  ctx.fillText("Click or Tap to Start",240,410);
  ctx.font="14px Georgia";
  ctx.fillText("© 2025 Barrel Club Catch",240,700);
}

function spawn(){
  barrels.push({x:Math.random()*400+20,y:-80,speed:2+Math.random()*2.5});
}

function update(dt){
  spawnTimer+=dt;
  if(spawnTimer>spawnDelay && state==="playing"){spawn();spawnTimer=0;}
  barrels.forEach(b=>b.y+=b.speed);
  barrels=barrels.filter(b=>{
    if(b.y+60>player.y && b.x+40>player.x && b.x<player.x+player.w){
      score+=10; caught++; if(caught>=totalBarrels) state="win"; return false;
    }
    if(b.y>720){misses++; if(misses>=3) state="lose"; return false;}
    return true;
  });
}

function draw(){
  ctx.drawImage(bg,0,0,480,720);
  barrels.forEach(b=>ctx.drawImage(barrelImg,b.x,b.y,60,60));
  ctx.drawImage(crateTex || crateImg, player.x, player.y, player.w, player.h);
  ctx.fillStyle="#f5deb3"; ctx.font="24px Georgia";
  ctx.textAlign="left"; ctx.fillText("Score: "+score,20,30);
}

function drawOverlay(type){
  const overlayColor=type==="win"?"rgba(0,0,0,0.6)":"rgba(0,0,0,0.75)";
  ctx.fillStyle=overlayColor;
  ctx.fillRect(0,0,480,720);
  ctx.fillStyle="#f5deb3"; ctx.textAlign="center";

  if(type==="win"){
    ctx.font="36px Georgia"; ctx.fillText("🎉 You Won! 🎉",240,320);
    ctx.font="22px Georgia"; ctx.fillText("Here’s your secret code:",240,360);
    ctx.font="30px Georgia"; ctx.fillText("077340",240,400);
  }else{
    ctx.font="28px Georgia"; ctx.fillText("You dropped too many barrels!",240,360);
    ctx.font="22px Georgia"; ctx.fillText("Score: "+score,240,400);
  }
  btn.classList.add("show");
}

canvas.addEventListener("click",()=>{
  if(state==="start"){
    score=0;misses=0;caught=0;barrels=[];spawnTimer=0;
    setTimeout(()=>state="playing",1000);
  }
});
btn.addEventListener("click",()=>{
  state="start"; btn.classList.remove("show");
});
canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect();
  player.x=e.clientX-r.left-player.w/2;
});
canvas.addEventListener("touchmove",e=>{
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  player.x=t.clientX-r.left-player.w/2;
});

function loop(ts){
  const dt=ts-last; last=ts;
  ctx.clearRect(0,0,480,720);
  if(state==="start") drawStart();
  else if(state==="playing"){update(dt);draw();}
  else if(state==="win"||state==="lose"){draw();drawOverlay(state);}
  requestAnimationFrame(loop);
}
bg.onload=()=>state="start";
requestAnimationFrame(loop);
</script>
</body>
</html>
