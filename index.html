<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrel Club Catch | Angel Share Overlook</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #1b120c;
    overflow: hidden;
  }

  canvas {
    display: block;
    margin: auto;
    width: 100vw;
    height: 100vh;
    object-fit: contain; touch-action: none;
    background: #1b120c;
  }

  #playAgain {
    position: absolute;
    left: 50%;
    top: 78%; z-index: 20;
    transform: translateX(-50%);
    background: #d4af37;
    border: 2px solid #3a2a1d;
    color: #1b120c;
    font-family: Georgia, serif;
    font-size: 20px;
    border-radius: 12px;
    padding: 10px 25px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }

  #playAgain.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Back button styling */
  #backButton {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(212,175,55,0.9);
    border: 2px solid #3a2a1d;
    color: #1b120c;
    font-family: Georgia, serif;
    font-size: 16px;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    z-index: 9999;
    transition: background 0.3s ease;
  }

  #backButton:hover {
    background: rgba(212,175,55,1);
  }
</style>
</head>
<body>
<button id="backButton" onclick="window.location.href='https://barrelclub.com'">← Back to Home</button>
<canvas id="game" width="480" height="720"></canvas>
<button id="playAgain">Play Again</button>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),btn=document.getElementById('playAgain');
let state='start',barrels=[],particles=[],score=0,caught=0,streak=0,misses=0,last=0,spawnTimer=0,bonusUntil=0,shake=0,targetX=240,started=false;
const goal=77,player={x:180,y:600,w:112,h:76};
const bg=new Image();bg.src='rickhouse-bg.png';
const barrelImg=new Image();barrelImg.src='barrel.png';
const crateImg=new Image();crateImg.src='crate.png';
let crateTex=null;
crateImg.onload=()=>{try{let c=document.createElement('canvas');c.width=crateImg.naturalWidth;c.height=crateImg.naturalHeight;const x=c.getContext('2d');x.drawImage(crateImg,0,0);let a=x.getImageData(0,0,c.width,c.height),d=a.data;for(let i=0;i<d.length;i+=4){let hi=Math.max(d[i],d[i+1],d[i+2]),lo=Math.min(d[i],d[i+1],d[i+2]);if(hi>170&&hi-lo<20)d[i+3]=0;}x.putImageData(a,0,0);crateTex=c;}catch(e){crateTex=crateImg;}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let audio=null;
function sound(freq=560,duration=.12){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.58),audio.currentTime+duration);g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){}}
function reset(){barrels=[];particles=[];score=0;caught=0;streak=0;misses=0;spawnTimer=0;shake=0;bonusUntil=0;targetX=canvas.width/2;player.x=targetX-player.w/2;btn.classList.remove('show');state='playing';started=true;last=performance.now();}
function burst(x,y,color='#ebbd64',n=15){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=80+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.65+Math.random()*.45,color,size:2+Math.random()*4});}}
function spawn(){let w=60;barrels.push({x:20+Math.random()*Math.max(1,canvas.width-w-40),y:-75,size:w,speed:125+Math.random()*42+Math.min(44,caught*.38),angle:(Math.random()-.5)*.28,spin:(Math.random()-.5)*.6});}
function end(win){state=win?'win':'lose';btn.textContent=win?'Play Again':'Try Again';btn.classList.add('show');if(win){burst(canvas.width/2,canvas.height*.37,'#f2c46a',90);sound(880,.35);}else sound(190,.35);}
function catchBarrel(b){caught++;streak++;score++;burst(b.x+b.size/2,b.y+b.size/2,'#f0c36a',10);sound(510+Math.min(streak,20)*24,.1);if(streak%10===0){score+=10;bonusUntil=performance.now()+2200;burst(canvas.width/2,canvas.height*.36,'#ffe39b',85);shake=8;sound(980,.34);}if(score>=goal)end(true);}
function missBarrel(){misses++;streak=0;shake=7;sound(180,.18);if(misses>=3)end(false);}
function update(dt,now){if(state!=='playing')return;spawnTimer+=dt;const delay=Math.max(.94,1.42-caught*.0025);if(spawnTimer>=delay){spawnTimer=0;spawn();}
player.x+=(clamp(targetX-player.w/2,0,canvas.width-player.w)-player.x)*Math.min(1,dt*19);
for(let i=barrels.length-1;i>=0;i--){let b=barrels[i];b.y+=b.speed*dt;b.angle+=b.spin*dt;if(b.y+b.size>=player.y+9&&b.y<player.y+player.h*.68&&b.x+b.size*.75>player.x+8&&b.x+b.size*.25<player.x+player.w-8){barrels.splice(i,1);catchBarrel(b);if(state!=='playing')break;}else if(b.y>canvas.height){barrels.splice(i,1);missBarrel();if(state!=='playing')break;}}
}
function backdrop(){if(bg.complete&&bg.naturalWidth){ctx.drawImage(bg,0,0,canvas.width,canvas.height);}else{let g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#4b2c1b');g.addColorStop(1,'#160e0a');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.fillStyle='rgba(14,8,5,.26)';ctx.fillRect(0,0,canvas.width,canvas.height);let g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'rgba(15,9,6,.75)');g.addColorStop(.35,'transparent');g.addColorStop(1,'rgba(9,5,3,.65)');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}
function drawBarrel(b){ctx.save();ctx.translate(b.x+b.size/2,b.y+b.size/2);ctx.rotate(b.angle);ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.shadowOffsetY=7;if(barrelImg.complete&&barrelImg.naturalWidth)ctx.drawImage(barrelImg,-b.size/2,-b.size/2,b.size,b.size);else{ctx.fillStyle='#925428';ctx.fillRect(-24,-28,48,56);ctx.fillStyle='#c7aa79';ctx.fillRect(-24,-20,48,7);ctx.fillRect(-24,12,48,7);}ctx.restore();}
function drawCart(){ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#000';ctx.shadowOffsetY=9;if((crateTex||crateImg).width)ctx.drawImage(crateTex||crateImg,player.x,player.y,player.w,player.h);else{ctx.fillStyle='#8e532d';ctx.fillRect(player.x,player.y,player.w,player.h);}ctx.restore();}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function hud(){ctx.textAlign='left';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillStyle='#ffe0a1';ctx.font='bold 16px system-ui';ctx.fillText('BARREL CLUB  •  THE RICKHOUSE RUN',18,27);ctx.shadowBlur=0;ctx.font='900 29px Georgia';ctx.fillStyle='#fff1d4';ctx.fillText(score+' / '+goal,18,63);ctx.font='bold 13px system-ui';ctx.fillStyle='#e7c484';ctx.fillText('BARRELS',18,81);ctx.textAlign='right';ctx.fillStyle='#ffe2ab';ctx.font='bold 15px system-ui';ctx.fillText('STREAK  '+streak,canvas.width-18,49);ctx.fillStyle='#f2ad96';ctx.fillText('MISSES  '+misses+' / 3',canvas.width-18,72);let w=canvas.width-36;ctx.fillStyle='#29170f';rounded(18,94,w,8,4);ctx.fill();ctx.fillStyle='#dba952';rounded(18,94,w*Math.min(1,score/goal),8,4);ctx.fill();}
function panel(title,lines,sub){ctx.fillStyle='rgba(12,8,6,.84)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign='center';ctx.fillStyle='#dfb667';ctx.font='bold 17px system-ui';ctx.fillText('BARREL CLUB',canvas.width/2,canvas.height*.23);ctx.fillStyle='#ffe5ae';ctx.font='bold '+Math.min(36,canvas.width*.075)+'px Georgia';ctx.fillText(title,canvas.width/2,canvas.height*.32);let y=canvas.height*.41;ctx.font='bold '+Math.min(19,canvas.width*.043)+'px system-ui';for(const line of lines){ctx.fillStyle='#fff1d6';ctx.fillText(line,canvas.width/2,y);y+=32;}ctx.fillStyle='#dbb47d';ctx.font='15px system-ui';ctx.fillText(sub,canvas.width/2,Math.min(canvas.height-115,y+34));}
function wrapLines(text,maxWidth){ctx.font='bold '+Math.min(19,canvas.width*.043)+'px system-ui';let out=[],line='';for(const word of text.split(' ')){let next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){out.push(line);line=word;}else line=next;}if(line)out.push(line);return out;}
function frame(now){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.83;if(shake<.2)shake=0;}backdrop();for(let b of barrels)drawBarrel(b);drawCart();ctx.restore();if(state!=='start')hud();if(now<bonusUntil&&state==='playing'){ctx.save();ctx.textAlign='center';ctx.shadowColor='#b56c20';ctx.shadowBlur=24;ctx.fillStyle='#ffe4a1';ctx.font='900 '+Math.min(31,canvas.width*.066)+'px Georgia';ctx.fillText('ANGEL SHARE BONUS!',canvas.width/2,canvas.height*.34);ctx.fillStyle='#fff';ctx.font='900 23px system-ui';ctx.fillText('+10 BARRELS',canvas.width/2,canvas.height*.34+36);ctx.restore();}
if(state==='start')panel('BARREL CLUB CATCH',['Catch barrels. Build your streak.','Every 10 catches = +10 bonus barrels.','Reach 77 to unlock the first clue!'],'Tap or click to start • Move your mouse or finger');
if(state==='win')panel('CONGRATS! YOU’RE READY TO START!',wrapLines('The first clue can be found by looking for the Angel Share sign in the house and gently sliding it open to the right.',canvas.width-50),'YOUR SCAVENGER HUNT BEGINS NOW');
if(state==='lose')panel('ONE MORE ROUND?',['Three barrels slipped away.','You caught '+caught+' barrels.'],'Tap Try Again to keep hunting');
}
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.y=canvas.height-105;player.x=clamp(player.x,0,canvas.width-player.w);targetX=clamp(targetX,0,canvas.width);}
function pointer(e){let r=canvas.getBoundingClientRect();targetX=(e.clientX-r.left)*canvas.width/r.width;}
canvas.addEventListener('pointermove',pointer);
canvas.addEventListener('pointerdown',e=>{pointer(e);if(state==='start')reset();});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
btn.addEventListener('click',e=>{e.stopPropagation();reset();});
window.addEventListener('resize',resize);resize();
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt,t);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;if(p.life<=0)particles.splice(i,1);}frame(t);for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/.5);ctx.fillRect(p.x,p.y,p.size,p.size);}ctx.globalAlpha=1;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</body>
</html>
